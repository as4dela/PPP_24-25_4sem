# A generic, minimal alembic configuration file.
[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names, e.g. %%(rev)s_%%(slug)s.py
file_template = %%(rev)s_%%(slug)s

# sys.path entries, comma separated
# prepend_sys_path = .

# timezone for timestamps within migration files
# timezone =

# database URL string.  Will try to read from environment variable DATABASE_URL
# if not set here.
# sqlalchemy.url = driver://user:pass@localhost/dbname
sqlalchemy.url = sqlite+aiosqlite:///./variant1_tsp_app.db # Placeholder, will be loaded from config

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S 